<!doctype html>
<html lang="zh-Hant-TW">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f4f5f2" />
		<title>教室主控台 | COSCUP</title>
		<link rel="stylesheet" href="/assets/styles.css" />
		<link rel="stylesheet" href="/assets/control.css" />
	</head>
	<body class="control-page">
		<header class="control-header">
			<div class="brand-lockup">
				<h1>教室主控台</h1>
			</div>
			<div class="header-tools">
				<span class="connection-pill" id="ws-status" role="status">連線中</span>
				<button
					type="button"
					class="icon-button"
					id="menu-button"
					aria-expanded="false"
					aria-controls="utility-menu"
					aria-label="開啟功能選單"
				>
					⋯
				</button>
				<div class="utility-menu" id="utility-menu" hidden>
					<button type="button" id="messages-button">訊息 <span id="message-count" hidden></span></button>
					<label class="utility-toggle"><input type="checkbox" id="alert-enabled" /> 啟用時間警報</label>
					<button type="button" id="test-clock-button">設定測試時間</button>
					<a href="/setup">快速設定</a>
					<a href="/timeline">進度時間軸</a>
					<a href="/debug">開啟除錯頁</a>
					<button type="button" id="logout-btn">登出</button>
				</div>
			</div>
		</header>

		<main class="control-shell">
			<div class="test-clock-banner" id="test-clock-banner" role="status" hidden></div>
			<section class="selection-strip" aria-labelledby="selected-rooms-title">
				<p class="section-kicker">工作範圍</p>
				<div class="selection-layout">
					<div class="selected-rooms-column">
						<div class="scope-column-heading">
							<h2 id="selected-rooms-title">已選取的教室</h2>
							<button type="button" class="secondary-button" id="choose-rooms-btn">選擇教室</button>
						</div>
						<div class="selected-room-tabs" id="selected-room-tabs"></div>
					</div>
					<div class="event-day-column">
						<div class="scope-column-heading">
							<h2>活動日期</h2>
						</div>
						<label class="day-picker">
							<span class="sr-only">活動日期</span>
							<select id="event-day-select" aria-label="選擇活動日期"></select>
						</label>
					</div>
				</div>
			</section>

			<section class="operator-panel" aria-labelledby="operator-title">
				<div class="section-heading">
					<div>
						<p class="section-kicker">目前工作</p>
						<h2 id="operator-title">目前操作的教室</h2>
					</div>
					<span class="live-mark" id="operator-status">尚未選擇</span>
				</div>
				<div id="operator-alert" aria-live="assertive"></div>
				<div id="operator-content"></div>
			</section>

			<section class="room-section" aria-labelledby="rooms-title">
				<div class="section-heading room-section-heading">
					<div>
						<p class="section-kicker">全覽</p>
						<h2 id="rooms-title">教室狀態</h2>
					</div>
					<label class="search-field">
						<span class="sr-only">搜尋教室名稱</span>
						<input id="room-search" type="search" placeholder="搜尋教室名稱" autocomplete="off" />
					</label>
				</div>
				<div class="room-grid" id="rooms-grid"></div>
			</section>

			<details class="advanced-section">
				<summary>進階操作</summary>
				<div class="advanced-content">
					<p>批次操作會套用到所有已選取的教室。</p>
					<div class="advanced-actions">
						<button type="button" class="start-button" id="start-all">開始所有已選教室</button>
						<button type="button" class="stop-button" id="stop-all">停止所有已選教室</button>
						<button type="button" class="danger-button" id="force-stop-all" hidden>
							強制停止所有已選教室
						</button>
					</div>
				</div>
			</details>
		</main>

		<aside class="message-drawer" id="message-drawer" aria-labelledby="messages-title" aria-hidden="true">
			<div class="drawer-header">
				<div>
					<p class="section-kicker">伺服器訊息</p>
					<h2 id="messages-title">訊息</h2>
				</div>
				<button type="button" class="icon-button" id="close-messages" aria-label="關閉訊息">×</button>
			</div>
			<div class="message-list" id="message-list" aria-live="polite"></div>
		</aside>
		<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
		<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

		<dialog id="action-dialog">
			<form method="dialog" class="control-dialog">
				<p class="section-kicker" id="action-dialog-kicker">確認操作</p>
				<h2 id="action-dialog-title"></h2>
				<p id="action-dialog-copy"></p>
				<div class="dialog-facts" id="action-dialog-facts"></div>
				<div class="dialog-actions">
					<button type="submit" class="secondary-button">取消</button>
					<button type="button" class="primary-button" id="action-confirm"></button>
				</div>
			</form>
		</dialog>
		<dialog id="agenda-dialog">
			<form method="dialog" class="control-dialog">
				<p class="section-kicker">切換議程</p>
				<h2>確認新議程</h2>
				<div class="agenda-confirmation" id="agenda-confirmation"></div>
				<div class="dialog-actions">
					<button type="submit" class="secondary-button">取消</button>
					<button type="button" class="primary-button" id="agenda-confirm">確認切換</button>
				</div>
			</form>
		</dialog>
		<dialog id="room-picker-dialog">
			<form method="dialog" class="control-dialog room-picker-form" id="room-picker-form">
				<p class="section-kicker">工作範圍</p>
				<h2>選擇教室</h2>
				<label class="search-field picker-search"
					><span class="sr-only">搜尋教室名稱</span
					><input id="room-picker-search" type="search" placeholder="搜尋教室名稱" autocomplete="off"
				/></label>
				<p class="picker-count" id="room-picker-count"></p>
				<div class="picker-options" id="room-picker-options"></div>
				<div class="dialog-actions">
					<button type="button" class="secondary-button" id="room-picker-cancel">取消</button
					><button type="button" class="primary-button" id="room-picker-apply">套用選擇</button>
				</div>
			</form>
		</dialog>
		<dialog id="test-clock-dialog">
			<form method="dialog" class="control-dialog" id="test-clock-form">
				<p class="section-kicker">測試工具</p>
				<h2>設定測試時間</h2>
				<p>設定後會回到目前頁面，時間會從指定值開始並按照真實時間繼續流逝。</p>
				<label class="test-clock-field"
					><span>模擬現在時間</span><input id="test-clock-input" type="datetime-local" step="1" required
				/></label>
				<div class="dialog-actions">
					<button type="button" class="secondary-button" id="test-clock-clear">恢復真實時間</button>
					<button type="submit" class="primary-button">套用並重新導向</button>
				</div>
			</form>
		</dialog>
		<script src="/assets/control.js" type="module"></script>
	</body>
</html>
