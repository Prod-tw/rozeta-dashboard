              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Meetings
  /api/v1/meetings/{meetingId}/summarize:
    post:
      operationId: MeetingOperations_generateSummary
      summary: Generate meeting summary
      description: |-
        Generate meeting summary

        Generates an AI-powered summary of the meeting transcriptions.
        The summary is streamed in real-time as it's generated and saved
        to the meeting record once complete.

        Summary generation process:
        - Fetches all transcriptions from the meeting
        - Uses the meeting's target language for the summary
        - Streams the summary content as it's generated
        - Saves the complete summary to the meeting once generation is complete

        Requirements:
        - Meeting must be in 'completed' status
        - Meeting duration must be greater than 180 seconds
        - Meeting must have transcriptions available
        - Meeting must have no more than 30 stored transcription entries
        - Combined transcription text must be at least 300 characters
        - Summary must not have been generated previously
        - Only the meeting owner can generate summaries

        Concurrency control:
        - Uses cache locks to prevent concurrent summary generation
        - Lock expires after 30 seconds
        - Returns error if summary generation is already in progress

        Error scenarios:
        - Meeting not completed: Returns 400 with 'meeting_not_completed_for_summary'
        - Summary already generated: Returns 400 with 'summary_already_generated'
        - Meeting duration is 180 seconds or less: Returns 400 with 'duration_too_short_for_summary'
        - Transcription eligibility or minimum length check fails: Returns 400 with 'transcription_too_short_for_summary'
        - No transcriptions found: Returns 400 with 'no_transcriptions_to_fetch'
        - Generation in progress: Returns 400 with 'summary_generation_in_progress'
      parameters:
        - name: meetingId
          in: path
          required: true
          description: Meeting ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Streamed summary content
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Streamed summary content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Streamed summary content
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Meetings
  /api/v1/meetings/{meetingId}/summary/export:
    get:
      operationId: MeetingOperations_exportSummary
      summary: Export meeting summary
      description: |-
        Export meeting summary

        Downloads the existing generated meeting summary as a Markdown attachment.
        This endpoint does not generate a summary; use the summarize endpoint first.

        Requirements:
        - Meeting must be in 'completed' status
