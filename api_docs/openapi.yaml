  /api/v1/meetings/{meetingId}/complete:
    post:
      operationId: MeetingOperations_completeMeeting
      summary: Complete meeting
      description: |-
        Complete a meeting

        Marks an active meeting as completed. This transitions the meeting status to 'completed'
        and records the end timestamp. Once completed, a meeting cannot be modified or receive
        new transcriptions/translations until it is resumed.

        What happens when completing:
        - Meeting status is changed to 'completed'
        - End timestamp (ended_at) is recorded
        - MeetingCompleted event is dispatched
        - All existing transcriptions and translations are preserved
        - Meeting becomes read-only (cannot receive new data)

        Requirements:
        - Meeting must NOT already be in 'completed' status
        - Only the meeting owner can complete the meeting
        - Typically used to mark the end of a meeting session

        After completion:
        - Use the resume endpoint to reuse the meeting for a new session
        - Transcriptions and translations remain accessible for viewing
      parameters:
        - name: meetingId
          in: path
          required: true
          description: Meeting ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Updated meeting details with completed status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.DetailedMeeting'
        '400':
          description: Updated meeting details with completed status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Updated meeting details with completed status
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Meetings
