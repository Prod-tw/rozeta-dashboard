          required: false
          description: 'Number of transcriptions to return (1-200, default: 100)'
          schema:
            type: integer
            format: int32
          explode: false
        - name: descendent
          in: query
          required: false
          description: Sort order - true for descending (newest first), false for ascending
          schema:
