  /api/v1/meetings/{meetingId}/resume:
    post:
      operationId: MeetingOperations_resumeMeeting
      summary: Resume completed meeting
      description: |-
        Resume a meeting

        Resumes a meeting by resetting it to ready status and clearing all
        transcription and translation data. This allows the meeting to be used again
        for a new session.

        What happens when resuming:
        - Meeting status is reset to 'ready'
        - All transcriptions are permanently deleted
        - All translations are permanently deleted
        - Metadata counters (transcriptionCount, translationCount) are reset to 0
        - Snapshot timestamp is cleared
        - Meeting configuration (title, languages, context) is preserved

        Requirements:
        - Meeting must not be in 'ready' status
        - Only the meeting owner can resume
      parameters:
        - name: meetingId
          in: path
          required: true
          description: Meeting ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Updated meeting details with ready status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.DetailedMeeting'
        '400':
          description: Updated meeting details with ready status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Updated meeting details with ready status
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Meetings
