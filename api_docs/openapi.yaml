      summary: Export meeting translations
      description: |-
        Export meeting translations

        Streams the completed meeting's translation text as a Markdown attachment.

        Requirements:
        - Meeting must be in 'completed' status
        - Only the meeting owner can export the translation

        File naming:
        - Filename contains the meeting finish time and snake-cased title
        - Format: `{snake_cased_title}_translation_{Ymd_His}.md`
      parameters:
        - name: meetingId
          in: path
          required: true
          description: Meeting ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Markdown file attachment
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            text/markdown:
              schema:
                type: string
        '400':
          description: Markdown file attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Markdown file attachment
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Meetings
  /api/v1/orders:
    get:
      operationId: OrderOperations_getOrders
      summary: List orders
      description: |-
        List user's orders

        Retrieves a paginated list of orders for the authenticated user.
        Supports filtering by order status.
      parameters:
        - name: page
          in: query
          required: false
          description: 'Page number for pagination (default: 1)'
          schema:
            type: integer
            format: int32
          explode: false
        - name: status
          in: query
          required: false
          description: Optional status filter
          schema:
            $ref: '#/components/schemas/Models.OrderStatus'
          explode: false
      responses:
        '200':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.Order'
                    x-typespec-name: Models.Order[]
                    description: Array of items
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PaginationMeta'
                    description: Pagination metadata
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      next:
                        type: string
                        nullable: true
                      prev:
                        type: string
                        nullable: true
                    required:
                      - first
                      - last
                      - next
                      - prev
                    description: Pagination links
                description: Paginated response wrapper
                x-typespec-name: PaginatedResponse<Models.Order>
        '403':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Orders
    post:
      operationId: OrderOperations_createOrder
      summary: Create subscription order
      description: |-
        Create a new subscription order

        Creates a new order for a subscription plan. This endpoint is used exclusively
        for subscription plan purchases. For purchasing additional credits, use the
        POST /orders/credit endpoint instead.

        Requirements:
        - plan_id is required and must be a valid active plan (sqid)
        - Plan must not be a trial plan
        - redirect_path (optional) must be a relative path without URL scheme

        Process flow:
        1. Validates plan_id using SQID encoding
        2. Verifies plan is active and not a trial plan
        3. Creates order record with plan association
        4. Initializes payment via payment gateway (Stripe)
        5. Returns order with payment URL in metadata

        Payment completion:
        - User completes payment on gateway's checkout page
        - Gateway confirms the payment
        - System processes payment and activates subscription plan
        - Plan's included minutes are added to user account

        Redirect behavior:
        - If redirect_path is provided, converts it to full URL (e.g., "/dashboard" -> "https://app.example.com/dashboard")
        - After successful payment, user is redirected to the specified URL instead of default success page
        - redirect_path must be a relative path (e.g., "/dashboard/billing")
        - Full URLs with schemes (http://, https://) are rejected by validation
      parameters: []
      responses:
        '201':
          description: Created order with payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Order'
        '403':
          description: Created order with payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '422':
          description: Created order with payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.CreateOrderRequest'
        description: Order creation request (requires plan_id, optional redirect_path)
  /api/v1/orders/available-subscription:
    get:
      operationId: OrderOperations_getAvailableSubscriptionOrder
      summary: Get available subscription order
      description: |-
        Get current available subscription order

        Retrieves the user's most recent completed subscription order.
        This endpoint is useful for determining the user's current active subscription
        and accessing subscription management features.

        The endpoint returns:
        - The latest completed order for a subscription plan (orderable_type = Plan)
        - Null if the user has no completed subscription orders

        Use cases:
        - Check if user has an active subscription
        - Get subscription order details for portal access
        - Display current subscription information in UI
        - Determine eligibility for subscription management features
      parameters: []
      responses:
        '200':
          description: The most recent completed subscription order or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Order'
        '403':
          description: The most recent completed subscription order or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Orders
  /api/v1/orders/credit:
    post:
      operationId: OrderOperations_chargeCredit
      summary: Charge additional credits
      description: |-
        Charge additional credits

        Creates a new order for purchasing additional credit hours.
        This endpoint allows users with active non-trial plans to buy extra credits
        for overage usage beyond their plan's included minutes.

        Requirements:
        - User must have an active subscription plan
        - Plan must not be a trial plan (is_trial = false)
        - Quantity must be between 1 and 100 (credit hours)
        - redirect_path (optional) must be a relative path without URL scheme

        Process flow:
        1. Validates user has a valid non-trial plan
        2. Creates order with orderable_type = null (credit-only order)
        3. Calculates amount based on plan's hourly price or default rate
        4. Initializes payment via payment gateway (Stripe)
        5. Returns order with payment URL in metadata

        Payment completion:
        - User completes payment on gateway's checkout page
        - Gateway confirms the payment
        - System processes payment and adds credit duration to user account
        - Credits are immediately available for use

        Credit calculation:
        - Each quantity unit = 1 hour (60 minutes) of credit
        - Price per hour is determined by user's current plan configuration
        - Total amount = quantity * hourly_price

        Redirect behavior:
        - If redirect_path is provided, converts it to full URL (e.g., "/dashboard/credits" -> "https://app.example.com/dashboard/credits")
        - After successful payment, user is redirected to the specified URL instead of default success page
        - redirect_path must be a relative path (e.g., "/dashboard/credits")
        - Full URLs with schemes (http://, https://) are rejected by validation
      parameters: []
      responses:
        '201':
          description: Created credit order with payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Order'
        '400':
          description: Created credit order with payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Created credit order with payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '422':
          description: Created credit order with payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.ChargeCreditRequest'
        description: Credit charge request with quantity and optional redirect_path
  /api/v1/orders/{orderId}:
    get:
      operationId: OrderOperations_getOrder
      summary: Get order details
      description: |-
        Get order details

        Retrieves detailed information about a specific order.
        Only the order owner can view their order details.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Order details with related plan information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Order'
        '403':
          description: Order details with related plan information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Orders
  /api/v1/orders/{orderId}/cancel:
    post:
      operationId: OrderOperations_cancelOrder
      summary: Cancel order
      description: |-
        Cancel order

        Cancels a pending order. Only orders in 'pending' status can be canceled.
        Only the order owner can cancel their orders.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Canceled order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Order'
        '403':
          description: Canceled order details
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Canceled order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Orders
  /api/v1/orders/{orderId}/portal:
    post:
      operationId: OrderOperations_getSubscriptionPortalUrl
      summary: Get subscription portal URL
      description: |-
        Get subscription portal URL

        Retrieves a URL to the payment gateway's subscription management portal
        for managing a completed subscription order. Users can use this portal to:
        - Update payment methods
        - View billing history
        - Cancel or modify subscriptions
        - Download invoices

        Validations:
        - Order must be in 'completed' status
        - Order must be for a subscription plan (not one-time credits)
        - Must be the user's latest completed subscription order
        - Only the order owner can access the portal

        The portal URL is generated by the payment gateway (Stripe or Creem) using
        the customer ID stored in the order's subscription_result metadata.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Portal URL for subscription management
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Payment gateway portal URL for subscription management
                required:
                  - url
        '403':
          description: Portal URL for subscription management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '422':
          description: Portal URL for subscription management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Orders
  /api/v1/plans:
    get:
      operationId: PlanOperations_getPlans
      summary: List available plans
      description: |-
        List available plans

        Retrieves all active subscription plans available for purchase.
        Response is cached for 600 seconds (10 minutes).

        Each plan includes:
        - Base price for the subscription period
        - Included minutes per period
        - Hourly rate for additional minutes
        - Plan duration in days
      parameters: []
      responses:
        '200':
          description: List of available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Models.Plan'
                x-typespec-name: Models.Plan[]
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Plans
