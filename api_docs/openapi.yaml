  /api/web/auth/callback:
    get:
      operationId: WebAuthOperations_handleCallback
      summary: Handle OAuth callback
      description: |-
        Handle OAuth provider callback

        Processes OAuth callback from provider, creates or updates user,
        and sets authentication cookie.
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from provider
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: false
          description: State parameter for CSRF protection
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirect to application with auth cookie set
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Web Authentication
  /api/web/auth/demo:
    get:
      operationId: WebAuthOperations_demoAuth
      summary: Demo authentication (dev only)
      description: 'WARNING: Remove in production'
      parameters: []
      responses:
        '302':
          description: Redirect with demo auth cookie
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: string
      tags:
        - Web Authentication
  /api/web/auth/login-token:
    get:
      operationId: WebAuthOperations_loginByToken
      summary: Set auth cookie from login token
      description: |-
        Convert a JWT token URL into an auth cookie

        Accepts a valid JWT token in the query string, authenticates it using the
        web auth guard, sets the same token as the HTTP-only auth_token cookie,
        and redirects back to the frontend.
      parameters:
        - name: token
          in: query
          required: true
          description: JWT authentication token
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirect to application with auth cookie set
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: string
        '401':
          description: Redirect to application with auth cookie set
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Web Authentication
  /api/web/auth/redirect:
    get:
      operationId: WebAuthOperations_redirectToProvider
      summary: Initiate OAuth authentication
      description: |-
        Redirect to OAuth provider

        Initiates OAuth authentication flow with the specified provider (Google).
        Redirects user to provider's consent page.
      parameters:
        - name: provider
          in: query
          required: true
          description: OAuth provider (currently only 'google' is supported)
          schema:
            $ref: '#/components/schemas/Models.OauthProvider'
          explode: false
      responses:
        '302':
          description: Redirect to provider
          headers:
            Location:
              required: true
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Web Authentication
  /api/web/meetings/{meetingId}/embed:
    get:
      operationId: EmbedMeetingAuthOperations_loginEmbedMeeting
      summary: Authenticate meeting embed
      description: |-
        Authenticate and open a meeting embed

        Accepts a JWT for the meeting owner, sets it as the HTTP-only auth_token
        cookie, and redirects to `/meetings/{meetingId}/embed` on the frontend.
        The token is removed from the redirect URL. All other query parameters are
        forwarded to the embed page.

        Color values are three- or six-digit RGB hex strings without a leading `#`.
        Font size and padding values are expressed in rem units.
      parameters:
        - name: meetingId
          in: path
          required: true
          description: Meeting ID (sqid)
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: JWT authentication token for the meeting owner
          schema:
            type: string
          explode: false
        - name: theme
          in: query
          required: false
          schema:
            type: string
            enum:
              - system
              - light
              - dark
          explode: false
        - name: fontSize
          in: query
          required: false
          schema:
            type: number
            format: double
          explode: false
        - name: paddingX
          in: query
          required: false
          schema:
            type: number
            format: double
          explode: false
        - name: paddingY
          in: query
          required: false
          schema:
            type: number
            format: double
          explode: false
        - name: layout
          in: query
          required: false
          schema:
            type: string
            enum:
              - inline
              - split-horizontal
              - split-vertical
              - transcription
              - translation
          explode: false
        - name: multiline
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: header
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: footer
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: backgroundColor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: transcriptionColor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: translationColor
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirect to the frontend embed page with the auth cookie set
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: string
        '401':
          description: Redirect to the frontend embed page with the auth cookie set
        '403':
          description: Redirect to the frontend embed page with the auth cookie set
        '404':
          description: Redirect to the frontend embed page with the auth cookie set
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Web Authentication
components:
  schemas:
    AccessDeniedResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - Access denied.
          description: Error message
      description: |-
        Access denied error response (403)
        Returned when user doesn't have permission to access a resource
    AuthCookie:
      type: object
      description: JWT Cookie-based authentication
    BroadcastingAuthRequest:
      type: object
      required:
        - room
      properties:
        room:
          type: string
          description: Room name to authenticate for (can include or exclude prefix)
        prefix:
          type: string
          enum:
            - private-
            - presence-
          description: Optional channel prefix (defaults to 'private-')
      description: Broadcasting authentication request
    BroadcastingAuthResponse:
      type: object
      required:
        - token
        - room_name
      properties:
        token:
          type: string
          description: JWT token for WebSocket authentication
        room_name:
          type: string
          description: Full room name with prefix (e.g., 'private-meeting.123')
      description: Broadcasting authentication response
    CommandRequest:
      type: object
      required:
        - action
        - target_id
      properties:
        action:
          allOf:
            - $ref: '#/components/schemas/Models.CommandAction'
          description: Command action to broadcast to the authenticated user's command channel
        target_id:
          type: string
          description: Target resource id. Use a meeting sqid for meeting actions and a conversation UUID for conversation actions.
        client_id:
          type: string
          nullable: true
          maxLength: 32
          description: Optional target client identifier. When provided, the command is broadcast to command.{user_id}.{client_id}; otherwise it is broadcast to command.{user_id}. The identifier is used for routing and is not included in the event payload.
        payload:
          type: object
          additionalProperties: {}
          x-typespec-name: Record<unknown>
          nullable: true
          description: Optional command-specific data forwarded unchanged in the Socket.IO event payload.
      description: Command request body
    ConversationDeleteResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the cached conversation descriptor was deleted
      description: Conversation delete response
    ConversationPingResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the ping refreshed the cached conversation descriptor
      description: Conversation ping response
    ConversationResponse:
      type: object
      required:
        - id
        - user_id
        - languages
        - topic
        - two_way_translation
      properties:
        id:
          type: string
          description: Conversation ID (UUID)
        user_id:
          type: string
          description: Sqid-encoded owner user ID
        languages:
          allOf:
            - $ref: '#/components/schemas/Models.ConversationLanguages'
          description: Language configuration used by the WebSocket transcription connection
        topic:
          allOf:
            - $ref: '#/components/schemas/Models.ConversationTopic'
          nullable: true
          description: Selected topic key, or null when no topic is configured
        two_way_translation:
          type: boolean
          description: Whether two-way translation is enabled
      description: Conversation descriptor response
    ConversationShareTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT token for conversation live sharing authentication
      description: Conversation live share token response
    CreateConversationRequest:
      type: object
      required:
        - languages
      properties:
        languages:
          allOf:
            - $ref: '#/components/schemas/Models.ConversationLanguages'
          description: Language configuration used by the WebSocket transcription connection
        topic:
          allOf:
            - $ref: '#/components/schemas/Models.ConversationTopic'
          nullable: true
          description: Optional topic key returned by GET /api/v1/general, e.g. Traveling or BusinessMeeting
        two_way_translation:
          type: boolean
          description: Enable two-way translation (translates in both configured directions)
      description: Request to create a short-lived conversation descriptor
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            x-typespec-name: string[]
