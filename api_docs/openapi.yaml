          in: path
          required: true
          description: Meeting ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: JWT token for live sharing access
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for live sharing authentication
                required:
                  - token
        '403':
