        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score (0.0 to 1.0)
        is_final:
          type: boolean
          description: Whether this is a final translation
        sequence:
          type: string
          description: Sequence identifier for cursor-based pagination
        is_translation:
          type: boolean
          enum:
            - true
          description: Always true for translations
      description: |-
        Translation data structure

        Real-time translation data returned from the API.
        This structure matches the TranslationData DTO output.
    Models.TranslationTerm:
      type: object
      required:
        - source
        - target
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 50
          description: Source language term
        target:
          type: string
          minLength: 1
          maxLength: 50
          description: Target language translation
      description: |-
        Translation term mapping for context-aware translation

        PHP Class: Modules\Context\Data\TranslationTerm
    Models.UpdateContextPresetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Preset name
        context:
          allOf:
            - $ref: '#/components/schemas/Models.TranscriptionContext'
          description: Optional transcription context
      description: Update context preset request
    Models.UpdateMeetingRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 50
          description: Meeting title
        languages:
          allOf:
            - $ref: '#/components/schemas/Models.MeetingLanguages'
          description: Language configuration
        context_preset_id:
          type: string
          description: Optional context preset ID (sqid) to load saved transcription context. Takes priority over the 'context' field if both are provided.
        context:
          allOf:
            - $ref: '#/components/schemas/Models.TranscriptionContext'
          description: Transcription context. Ignored if 'context_preset_id' is provided.
        two_way_translation:
          type: boolean
          description: Enable two-way translation (translates from target back to source)
      description: Request to update an existing meeting
    Models.User:
      type: object
      required:
        - id
        - name
        - email
        - email_verified_at
        - config
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: User ID (sqid)
        name:
          type: string
          description: User's full name
        email:
          type: string
          format: email
          description: User's email address
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: Email verification timestamp
        config:
          type: object
          allOf:
            - $ref: '#/components/schemas/Models.UserConfig'
          nullable: true
          description: User configuration
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      description: User model representing an authenticated user
    Models.UserConfig:
      type: object
      required:
        - timezone
      properties:
        timezone:
          type: string
          nullable: true
          description: User timezone as an IANA timezone identifier, e.g. Asia/Taipei, America/New_York, or null
      description: |-
        User configurable preferences

        Resource shape returned by GET/PUT /api/v1/users/config
    Models.UserDurationMetadata:
      type: object
      properties:
        source:
          type: string
          nullable: true
          description: Source of the duration credit (plan, purchase, etc.)
        order_id:
          type: string
          nullable: true
          description: Related order ID
      additionalProperties: {}
      description: |-
        User duration metadata

        PHP Class: Modules\Plan\Data\UserDurationMetadata
    Models.UserFeatures:
      type: object
      required:
        - remote_control
      properties:
        remote_control:
          type: boolean
          description: Whether remote control commands are enabled for the authenticated user
      description: |-
        Feature flags returned for the authenticated user

        Nested in MeResource response
    Models.UserPlanInfo:
      type: object
      required:
        - id
        - slug
        - name
        - level
        - start_at
        - end_at
        - is_trial
        - config
      properties:
        id:
          type: string
          description: Plan ID (sqid)
        slug:
          type: string
          description: Plan slug (unique identifier)
        name:
          type: string
          description: Plan name
        level:
          type: integer
          format: int32
          minimum: 0
          description: Plan tier level
        start_at:
          type: integer
          format: int64
          description: Plan activation Unix timestamp (seconds since epoch)
        end_at:
          type: integer
          format: int64
          description: Plan expiration Unix timestamp (seconds since epoch)
        is_trial:
          type: boolean
          description: Whether the plan is a trial plan
        config:
          allOf:
            - $ref: '#/components/schemas/Models.PlanConfig'
          description: Plan configuration (full PlanConfig object)
      description: |-
        User's active plan information

        Nested in MeResource response
    Models.UserPlanMetadata:
      type: object
      properties:
        order_id:
          type: string
          nullable: true
          description: Order ID that created this user plan
      additionalProperties: {}
      description: |-
        User plan metadata

        PHP Class: Modules\Plan\Data\UserPlanMetadata
    Models.UserProfile:
      type: object
      required:
        - id
        - name
        - email
        - email_verified_at
        - config
        - features
        - plan
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: User ID (sqid)
        name:
          type: string
          description: User's full name
        email:
          type: string
          format: email
          description: User's email address
        email_verified_at:
          type: integer
          format: int64
          description: Email verification Unix timestamp (seconds since epoch)
        config:
          allOf:
            - $ref: '#/components/schemas/Models.UserConfig'
          description: User configuration
        features:
          allOf:
            - $ref: '#/components/schemas/Models.UserFeatures'
          description: Feature flags available to the authenticated user
        plan:
          type: object
          allOf:
            - $ref: '#/components/schemas/Models.UserPlanInfo'
          nullable: true
          description: Current active subscription plan
        created_at:
          type: integer
          format: int64
          description: Account creation Unix timestamp (seconds since epoch)
        updated_at:
          type: integer
          format: int64
          description: Last update Unix timestamp (seconds since epoch)
      description: |-
        User profile with current plan information

        Resource class: App\Http\Resources\MeResource
        Note: All timestamps are Unix timestamps (seconds since epoch)
    Models.WebSocketEvent:
      type: string
      enum:
        - connection.created
      description: |-
        WebSocket server events

        Events sent by the server to the client during WebSocket communication
        PHP Class: App\Enums\WebSocketEvent

        Used in WebSocket connections:
        - ws://localhost:9501/websocket/meeting
        - ws://localhost:9501/websocket/conversation
    OnlineCountResponse:
      type: object
      required:
        - online_count
      properties:
        online_count:
          type: integer
          format: int32
          description: Total clients currently connected to the private room
      description: Online count response
    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
        - last_page
        - first_page_url
        - last_page_url
        - next_page_url
        - prev_page_url
      properties:
        current_page:
          type: integer
          format: int32
          description: Current page number
        per_page:
          type: integer
          format: int32
          description: Number of items per page
        total:
          type: integer
          format: int32
          description: Total number of items
        last_page:
          type: integer
          format: int32
          description: Total number of pages
        first_page_url:
          type: string
          description: Link to first page
        last_page_url:
          type: string
          description: Link to last page
        next_page_url:
          type: string
          nullable: true
          description: Link to next page
        prev_page_url:
          type: string
          nullable: true
          description: Link to previous page
      description: Pagination metadata
    SendLoginEmailRequest:
      type: object
      required:
        - email
        - token
      properties:
        email:
          type: string
          description: User email address
        token:
          type: string
          description: Cloudflare Turnstile token for CAPTCHA verification
      description: Send login email request
    SendLoginEmailResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Success status
      description: Standard success response
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Success status
      description: Standard success response
    TokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT authentication token
      description: Authentication token response
    UnauthenticatedResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - Unauthenticated.
          description: Error message
      description: |-
        Unauthenticated error response (403)
        Returned when user is not authenticated or token is invalid
    UpdateConversationRequest:
      type: object
      required:
        - languages
      properties:
        languages:
          allOf:
            - $ref: '#/components/schemas/Models.ConversationLanguages'
          description: Language configuration used by the WebSocket transcription connection
        topic:
          allOf:
            - $ref: '#/components/schemas/Models.ConversationTopic'
          nullable: true
          description: Optional topic key returned by GET /api/v1/general, e.g. Traveling or BusinessMeeting. Send null to clear the topic.
        two_way_translation:
          type: boolean
          description: Enable two-way translation (translates in both configured directions)
      description: Request to update a short-lived conversation descriptor
    UpdateUserConfigRequest:
      type: object
      properties:
        timezone:
          type: string
          nullable: true
          description: User timezone as an IANA timezone identifier, e.g. Asia/Taipei, America/New_York, or null
      description: Update user config request
    Versions:
      type: string
      enum:
        - '1.0'
servers:
  - url: http://dev.rozeta.app
