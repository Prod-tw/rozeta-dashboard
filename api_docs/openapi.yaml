  /api/v1/meetings/{meetingId}/share-token:
    post:
      operationId: MeetingOperations_getShareToken
      summary: Get live share token
      description: |-
        Get live share token

        Generates a JWT token for live sharing access to a meeting.
        This token allows others to view the meeting in real-time.

        Live sharing features:
        - Requires active subscription with live sharing enabled
        - Subject to concurrency limits based on user's plan
        - Token is valid for the duration of the meeting

        The endpoint checks:
        - User's current plan has live sharing enabled
        - Current active viewers doesn't exceed max concurrency limit
      parameters:
