openapi: 3.0.0
info:
  title: Rozeta API
  description: |-
    Rozeta API - Meeting Transcription and Translation Service

    This API provides comprehensive meeting transcription and translation services
    with subscription management and payment processing capabilities.

    Features:
    - Real-time meeting transcription
    - Multi-language translation support (34 languages)
    - Subscription-based credit management
    - Stripe payment integration
    - OAuth authentication (Google)
  version: '1.0'
tags:
  - name: Authentication
  - name: Web Authentication
  - name: Users
  - name: Meetings
  - name: Conversations
  - name: Context Presets
  - name: Orders
  - name: Plans
  - name: Credits
  - name: General
  - name: Health
  - name: Broadcasting
  - name: Commands
paths:
  /api/v1/auth/login-link:
    post:
      operationId: AuthAPIOperations_sendLoginEmail
      summary: Send login link via email
      description: |-
        Send login link via email

        Generates a secure one-time login link and sends it to the user's email.
        The link is valid for 10 minutes and can only be used once.
        Uses Cloudflare Turnstile for CAPTCHA verification.

        Note: Always returns success even if email doesn't exist (security by obscurity).
      parameters: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendLoginEmailResponse'
        '422':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLoginEmailRequest'
  /api/v1/auth/logout:
    post:
      operationId: AuthAPIOperations_logout
      summary: Logout user
      description: |-
        Logout user

        Invalidates the current authentication session by expiring the auth_token cookie.
        Sets the cookie expiration to -1 minute, effectively removing it from the client.
      parameters: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Authentication
  /api/v1/auth/me:
    get:
      operationId: AuthAPIOperations_getUser
      summary: Get current user profile
      description: |-
        Get authenticated user profile

        Returns the current user's profile information including active subscription plan.
        Response is cached for 600 seconds (10 minutes).
      parameters: []
      responses:
        '200':
          description: User profile with current plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.UserProfile'
        '403':
          description: User profile with current plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      operationId: AuthAPIOperations_refreshToken
      summary: Refresh authentication token
      description: |-
        Refresh authentication token

        Generates a new JWT token and sets it in an HTTP-only cookie.
        Token expires after 3 days (4320 minutes).
      parameters: []
      responses:
        '200':
          description: New authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '403':
          description: New authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Authentication
  /api/v1/broadcasting/auth:
    post:
      operationId: BroadcastingAPIOperations_authenticateBroadcasting
      summary: Authenticate for WebSocket broadcasting
      description: |-
        Authenticate for WebSocket broadcasting

        Authenticates the current user for a specific broadcasting channel/room.
        Returns a JWT token and full room name for WebSocket connection.

        The token includes:
        - User ID (sub claim)
        - Room name
        - Expiration time (TTL from JWT config)

        Channel types:
        - Private channels: Requires authentication, prefixed with 'private-'
        - Presence channels: Requires authentication, prefixed with 'presence-'
        - Public channels: No authentication required

        Rozeta private channel names:
        - `meeting.{meeting_id}`
        - `meeting.transcription.{meeting_id}`
        - `meeting.translation.{meeting_id}`
        - `conversation.{conversation_id}` for `conversation.started` and `conversation.paused`
        - `conversation.transcription.{conversation_id}` for `transcription.created`
        - `conversation.translation.{conversation_id}` for `translation.created`
        - `command.{user_id}` for commands without a target client, where `user_id`
        is the authenticated user's sqid
        - `command.{user_id}.{client_id}` for commands targeted to a specific client

        Conversation channel ids are conversation ids returned by
        `POST /api/v1/conversations`, not user ids.

        If room name doesn't include a prefix, it will be automatically prefixed
        based on the 'prefix' parameter (defaults to 'private-').
      parameters: []
      responses:
        '200':
          description: Broadcasting authentication token and room name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastingAuthResponse'
        '403':
          description: Broadcasting authentication token and room name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Broadcasting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastingAuthRequest'
  /api/v1/commands:
    post:
      operationId: CommandAPIOperations_sendCommand
      summary: Send command
      description: |-
        Send command

        Validates that the authenticated user owns the target meeting or
        conversation, then broadcasts a command event to the user's private
        Socket.IO command channel.

        Subscribe to `command.{user_id}` for commands sent without `client_id`, or
        `command.{user_id}.{client_id}` for commands targeted to a specific client,
        where `user_id` is the authenticated user's sqid. Event names:
        - `command.goto_meeting`
        - `command.goto_meeting_embed`
        - `command.start_meeting`
        - `command.pause_meeting`
        - `command.goto_conversation`
        - `command.start_conversation`
        - `command.pause_conversation`

        Meeting command payloads include `{ "meeting_id": "<meeting_sqid>", "payload": {} }`.
        Conversation command payloads include `{ "conversation_id": "<conversation_uuid>", "payload": {} }`.
        The nested `payload` contains the command-specific data from the request, or `null` when omitted.
      parameters: []
      responses:
        '200':
          description: Command event dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Authentication is required to send commands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: The authenticated user does not own the target conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: The target meeting was not found for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The command action or target id is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
        description: Command action and target resource
  /api/v1/context-presets:
    get:
      operationId: ContextPresetOperations_getContextPresets
      summary: List context presets
      description: |-
        List user's context presets

        Retrieves a paginated list of context presets for the authenticated user.
        Context presets allow users to save frequently used transcription contexts
        for quick reuse across multiple meetings.

        Supports filtering by preset name using partial text matching (case-insensitive).
      parameters:
        - name: page
          in: query
          required: false
          description: 'Page number for pagination (default: 1)'
          schema:
            type: integer
            format: int32
          explode: false
        - name: name
          in: query
          required: false
          description: Optional name filter (partial match using LIKE)
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: Paginated list of context presets
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.ContextPreset'
                    x-typespec-name: Models.ContextPreset[]
                    description: Array of items
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PaginationMeta'
                    description: Pagination metadata
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      next:
                        type: string
                        nullable: true
                      prev:
                        type: string
                        nullable: true
                    required:
                      - first
                      - last
                      - next
                      - prev
                    description: Pagination links
                description: Paginated response wrapper
                x-typespec-name: PaginatedResponse<Models.ContextPreset>
        '403':
          description: Paginated list of context presets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Context Presets
    post:
      operationId: ContextPresetOperations_createContextPreset
      summary: Create context preset
      description: |-
        Create a new context preset

        Creates a new context preset with transcription context information.
        Context presets can be used to improve transcription accuracy across
        multiple meetings by providing domain-specific terminology and translations.

        Context fields (all optional):
        - domain: Industry/field (e.g., "medical", "legal", "technology")
        - topic: Specific meeting subject
        - text: Additional context information
        - terms: Array of custom terminology and jargon
        - translation_terms: Array of specific term translations
      parameters: []
      responses:
        '201':
          description: Created context preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ContextPreset'
        '403':
          description: Created context preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '422':
          description: Created context preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Context Presets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.CreateContextPresetRequest'
        description: Context preset creation request
  /api/v1/context-presets/{presetId}:
    get:
      operationId: ContextPresetOperations_getContextPreset
      summary: Get context preset details
      description: |-
        Get context preset details

        Retrieves detailed information about a specific context preset.
      parameters:
        - name: presetId
          in: path
          required: true
          description: Context preset ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Context preset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ContextPreset'
        '403':
          description: Context preset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Context Presets
    put:
      operationId: ContextPresetOperations_updateContextPreset
      summary: Update context preset
      description: |-
        Update context preset

        Updates an existing context preset with new information.
        All context fields are optional and will replace existing values.
      parameters:
        - name: presetId
          in: path
          required: true
          description: Context preset ID (sqid)
          schema:
            type: string
      responses:
        '200':
          description: Updated context preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ContextPreset'
        '403':
          description: Updated context preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '422':
          description: Updated context preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Context Presets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.UpdateContextPresetRequest'
        description: Context preset update request
    delete:
      operationId: ContextPresetOperations_deleteContextPreset
      summary: Delete context preset
      description: |-
        Delete context preset

        Permanently deletes a context preset. This action cannot be undone.
      parameters:
        - name: presetId
          in: path
          required: true
          description: Context preset ID (sqid)
          schema:
            type: string
      responses:
        '204':
          description: No content on success
        '403':
          description: No content on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Context Presets
  /api/v1/conversations:
    post:
      operationId: ConversationAPIOperations_createConversation
      summary: Create conversation
      description: |-
        Create conversation

        Creates a short-lived conversation descriptor for the authenticated user.
        The descriptor stores languages, topic-derived transcription context, and
        two-way translation mode. The WebSocket start action later references this
        descriptor by id.

        The returned `id` must be sent in the `start_conversation` WebSocket
        action payload and used for Socket.IO channels:
        - `conversation.{id}` for `conversation.started` and `conversation.paused`
        - `conversation.transcription.{id}` for `transcription.created`
        - `conversation.translation.{id}` for `translation.created`
      parameters: []
      responses:
        '200':
          description: New conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '403':
          description: New conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '422':
          description: New conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
        description: Conversation configuration
  /api/v1/conversations/{conversationId}:
    put:
      operationId: ConversationAPIOperations_updateConversation
      summary: Update conversation
      description: |-
        Update conversation

        Updates a short-lived conversation descriptor before or during a live
        conversation session. The WebSocket `start_conversation` action and
        subsequent reconnects load the latest cached descriptor by id.

        If `topic` is omitted, the previous topic and topic-derived transcription
        context are preserved. If `topic` is null, the topic context is cleared.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Updated conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          description: Updated conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Updated conversation descriptor
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/AccessDeniedResponse'
        '422':
          description: Updated conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
        description: Updated conversation configuration
    delete:
      operationId: ConversationAPIOperations_deleteConversation
      summary: Delete conversation
      description: |-
        Delete conversation

        Deletes the short-lived cached conversation descriptor. After deletion,
        route binding, websocket start, live sharing, and broadcasting
        authorization can no longer resolve the conversation id.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDeleteResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/AccessDeniedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
  /api/v1/conversations/{conversationId}/online-count:
    get:
      operationId: ConversationAPIOperations_getConversationOnlineCount
      summary: Get conversation online count
      description: |-
        Get conversation online count

        Retrieves the current number of clients connected to the conversation private room.
        Only the conversation owner can access this endpoint.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Current online count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineCountResponse'
        '400':
          description: Current online count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Current online count
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/AccessDeniedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
  /api/v1/conversations/{conversationId}/ping:
    post:
      operationId: ConversationAPIOperations_pingConversation
      summary: Ping conversation
      description: |-
        Ping conversation

        Refreshes the short-lived cached conversation descriptor so route binding,
        websocket start, live sharing, and broadcasting authorization can continue
        to resolve the conversation.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPingResponse'
        '400':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Success flag
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/AccessDeniedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
  /api/v1/conversations/{conversationId}/qrcode:
    get:
      operationId: ConversationAPIOperations_getConversationQrCode
      summary: Get conversation QR code
      description: |-
        Get conversation QR code

        Generates a PNG QR code for the authenticated user's conversation URL.
        The QR code encodes the conversation QR endpoint URL using the conversation UUID.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: PNG image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: PNG image bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: PNG image bytes
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnauthenticatedResponse'
                  - $ref: '#/components/schemas/AccessDeniedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
  /api/v1/conversations/{conversationId}/share:
    get:
      operationId: ConversationAPIOperations_getShareConversation
      summary: Get shared conversation view
      description: |-
        Get shared conversation view

        Retrieves the shared conversation descriptor for live share viewers.
        Access requires either an authenticated owner session or a valid bearer
        share token for the same conversation id.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Shared conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '403':
          description: Shared conversation descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
  /api/v1/conversations/{conversationId}/share-token:
    post:
      operationId: ConversationAPIOperations_getConversationShareToken
      summary: Get conversation live share token
      description: |-
        Get conversation live share token

        Generates a JWT token for live sharing access to a conversation.
        This token can authorize:
        - `GET /api/v1/conversations/{id}/share`
        - Socket.IO private channels for the same conversation id

        The endpoint checks the owner's live sharing concurrency limit.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: JWT token for conversation live sharing access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationShareTokenResponse'
        '400':
          description: JWT token for conversation live sharing access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      tags:
        - Conversations
  /api/v1/credits/usage:
    get:
      operationId: CreditOperations_getUsage
      summary: Get credit usage
      description: |-
        Get credit usage

        Retrieves the authenticated user's credit usage information,
        including total allocated minutes, available minutes, and used minutes.

        Credits are consumed during meeting transcription and translation.
        Credits are allocated through:
        - Active subscription plans (included minutes)
        - Additional credit purchases
      parameters: []
      responses:
        '200':
          description: Current credit usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.CreditUsage'
        '403':
          description: Current credit usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        default:
          description: An unexpected error response.
          content:
