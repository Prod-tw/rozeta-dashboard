services:
  dashboard:
    # Deployment previously required repeating every docker run option manually.
    # Compose now defaults to the production registry while allowing an explicit override.
    image: ${IMAGE:-image.prod.tw/rozeta-dashboard:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:8080'
    environment:
      # Empty credentials previously failed only after the container started. Required
      # interpolation now reports the missing variable before Compose creates it.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      EXTERNAL_API_TOKEN: ${EXTERNAL_API_TOKEN:?EXTERNAL_API_TOKEN is required}
    volumes:
      - type: bind
        # The old room.csv mount followed the removed -token-file option. Keep the
        # runtime-only mount while using the new account.csv and -account naming.
        source: ${ACCOUNT_FILE:-./account.csv}
        target: /data/account.csv
        read_only: true
      - type: bind
        # Meeting lists previously inherited Rozeta's API order. Mount the event
        # mapping at runtime so Compose enables timetable ordering by default.
        source: ${SESSION_FILE:-./session.csv}
        target: /data/session.csv
        read_only: true
      # The desired state is the controller's source of truth across restarts.
      # CSV credentials remain read-only while this dedicated named volume is writable.
      - type: volume
        source: controller-state
        target: /var/lib/rozeta-dashboard
    command: ['-account', '/data/account.csv', '-session', '/data/session.csv', '-state', '/var/lib/rozeta-dashboard/controller-state.json']
    # The application does not write locally or need Linux capabilities. These limits
    # replace Docker's broader defaults without changing network access to Rozeta.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    pids_limit: 100
    stop_grace_period: 15s

volumes:
  controller-state:
